    /* Core display wrapper */

    .text-line {

    .line-gap {
      margin-bottom: 9px; 
    }

    .answer-block {
      font-family: 'Impact', 'Arial Black', sans-serif;

      font-weight: 900;
      text-transform: uppercase;
      margin: 0;
      line-height: 0.90;
      letter-spacing: 2px;
      }

@keyframes dynamicFlicker {
  0%, 100% { opacity: 1; }
  3% { opacity: 0.4; }
  6% { opacity: 1; }
  7% { opacity: 0.4; }
  8% { opacity: 1; }
  9% { opacity: 0.4; }
  10% { opacity: 1; }
  45% { opacity: 1; }
  46% { opacity: 0.3; }
  47% { opacity: 0.9; }
  48% { opacity: 0.3; }
  50% { opacity: 1; }
  53% { opacity: 1; }
  54% { opacity: 0.2; }
  56% { opacity: 1; }
}

.answer-block {
  font-family: 'Impact', 'Arial Black', sans-serif;
  color: #E22525;
  font-size: clamp(180px, 26vw, 340px);
  font-weight: 90;
  text-transform: uppercase;
  margin: 0;
  line-height: 0.90;
  letter-spacing: 2px;
  margin-top: 10px;
  transform: scaleX(0.84);
  transform: scaleY(1.05);
  transform-origin: center;
  animation: dynamicFlicker 5s linear infinite;
}


    .email-link {
      display: inline-block;
      position: relative;
      z-index: 10;
      margin-top: 30px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #E22525;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .email-link:hover {
      color: #FFFFFF;
      text-decoration: underline;
    }

    /* Mobile Optimization Override */
@media (max-width: 600px) {
  .display-container {
    max-width: 95vw;
  }

  .text-line {
    /* Slightly smaller font sizing so it fits neatly across a vertical phone screen */
    font-size: clamp(45px, 12vw, 75px);
    /* Removes the horizontal stretch on mobile so characters don't clip off the screen */
    transform: none; 
    /* Allows the text to break into normal words instead of forcing one endless line */
    white-space: normal; 
  }

  .answer-block {
    /* Scales down the giant YES to match a portrait phone viewport */
    font-size: clamp(110px, 25vw, 180px);
    /* Keeps the vertical stretch but drops the horizontal squeeze so it reads clearly */
    transform: scaleY(1.05); 
    margin-top: 5px;
  }

  .email-link {
    font-size: 14px;
    margin-top: 25px;
  }
}
